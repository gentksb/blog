name: Run Lint and Tests

on:
  push:
    branches:
      - "master"
    paths:
      - "src/server/**"
      - "src/components/**"
      - "src/content/**"
      - "src/layouts/**"
      - "src/lib/**"
      - "src/pages/**"
      - "src/plugins/**"
      - "src/styles/**"
      - "src/config.ts"
      - "src/consts.ts"
      - "src/env.d.ts"
      - "src/worker.ts"
      - "src/content.config.ts"
      - "test/**"
      - "astro.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "wrangler.jsonc"
      - "wrangler.test.jsonc"
      - ".assetsignore"
      - "pnpm-workspace.yaml"
      - "knip.json"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "src/server/**"
      - "src/components/**"
      - "src/content/**"
      - "src/layouts/**"
      - "src/lib/**"
      - "src/pages/**"
      - "src/plugins/**"
      - "src/styles/**"
      - "src/config.ts"
      - "src/consts.ts"
      - "src/env.d.ts"
      - "src/worker.ts"
      - "src/content.config.ts"
      - "test/**"
      - "astro.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "wrangler.jsonc"
      - "wrangler.test.jsonc"
      - ".assetsignore"
      - "pnpm-workspace.yaml"
      - "knip.json"
      - ".github/workflows/**"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # 変更範囲の差分を取るため全履歴が必要
          fetch-depth: 0

      # pnpmキャッシュを利用して、高速に依存関係をインストールする
      # https://github.com/pnpm/action-setup/tree/v4/?tab=readme-ov-file#use-cache-to-reduce-installation-time

      - uses: pnpm/action-setup@v5
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Run Lint
        run: pnpm run lint

      - name: Run Typecheck
        run: pnpm run typecheck

      - name: Run Lint unused (knip)
        run: pnpm run lint:unused

      - name: Detect content-only change
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="origin/${{ github.base_ref }}...HEAD"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
          fi
          changed=$(git diff --name-only "$range" 2>/dev/null) || changed=""
          # 差分が取れなかった場合はフルテストへ倒す
          if [ -z "$changed" ] || printf '%s\n' "$changed" | grep -qv '^src/content/'; then
            echo "content_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "content_only=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create dist directory for tests
        run: mkdir -p dist/client

      # 記事だけの変更では Amazon Creators API を叩くテストを走らせない
      - name: Run Tests (content only)
        if: steps.scope.outputs.content_only == 'true'
        run: pnpm run test:light

      - name: Run Tests
        if: steps.scope.outputs.content_only != 'true'
        run: |
          touch .dev.vars
          echo "PARTNER_TAG=$PARTNER_TAG" >> .dev.vars
          echo "CREATORS_CREDENTIAL_ID=$CREATORS_CREDENTIAL_ID" >> .dev.vars
          echo "CREATORS_CREDENTIAL_SECRET=$CREATORS_CREDENTIAL_SECRET" >> .dev.vars
          echo "CREATORS_CREDENTIAL_VERSION=$CREATORS_CREDENTIAL_VERSION" >> .dev.vars
          pnpm run test
        env:
          PARTNER_TAG: ${{ secrets.PARTNER_TAG }}
          CREATORS_CREDENTIAL_ID: ${{ secrets.CREATORS_CREDENTIAL_ID }}
          CREATORS_CREDENTIAL_SECRET: ${{ secrets.CREATORS_CREDENTIAL_SECRET }}
          CREATORS_CREDENTIAL_VERSION: ${{ secrets.CREATORS_CREDENTIAL_VERSION }}
