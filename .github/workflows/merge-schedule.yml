name: Merge Schedule

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
  # 主な起動元は blog Worker の Cron Trigger（5分毎）からの workflow_dispatch
  workflow_dispatch:
  # Cron Trigger が止まった場合の予備。毎時0分はGitHub側の高負荷で遅延・脱落しやすいため避ける（UTC）
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: merge-schedule-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'scheduled' }}
  cancel-in-progress: false

jobs:
  merge_schedule:
    runs-on: ubuntu-latest
    steps:
      - uses: gr2m/merge-schedule-action@v2
        with:
          # Merge method to use. Possible values are merge, squash or
          # rebase. Default is merge.
          merge_method: squash
          # Time zone to use. Default is UTC.
          # src/lib/mergeSchedule.ts の期日判定がUTC前提のため変更しない
          time_zone: "UTC"
          # Require all pull request statuses to be successful before
          # merging. Default is `false`.
          require_statuses_success: "true"
          # Label to apply to the pull request if the merge fails. Default is
          # `automerge-fail`.
          automerge_fail_label: "merge-schedule-failed"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
